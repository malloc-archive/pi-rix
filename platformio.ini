
; Raspberry Pi Guitarix foot controller, ESP32-S3-WROOM-1-N16R8
; Native USB CDC (USB-C connector marked OTG) is used by Pi serial bridge.
[env:esp32s3_n16r8]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino

; N16R8: 16 MB QSPI flash + 8 MB octal PSRAM.
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; 1 = Hardware USB CDC/JTAG; 1 = make native USB Serial available on boot.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM

lib_deps =
    moononournation/GFX Library for Arduino@1.6.0

monitor_speed = 115200
upload_speed = 460800
